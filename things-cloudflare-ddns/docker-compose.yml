version: "3.7"

# No web UI, so there is no app_proxy service. The manifest port is only a
# placeholder; opening the app from the Umbrel home screen shows nothing.

services:
  ddns:
    image: favonia/cloudflare-ddns:1.18.0@sha256:345b41895a8846d74c62d30bd27e61101a754f8ab8da10c68115823883803afb
    # Host networking so the updater sees the host's real public IP stack
    # (upstream's recommended setup; needed if IPv6 is ever enabled).
    network_mode: host
    user: "1000:1000"
    read_only: true
    cap_drop:
      - all
    security_opt:
      - no-new-privileges:true
    restart: on-failure
    environment:
      IP6_PROVIDER: none
    # CLOUDFLARE_API_TOKEN, DOMAINS and PROXIED come from the app data .env file
    # (or the app's environment variable settings). PROXIED is not set here so
    # it can be chosen per host, e.g. PROXIED=is(id.example.com); unset = false.
    env_file:
      - path: ${APP_DATA_DIR}/data/.env
        required: false
