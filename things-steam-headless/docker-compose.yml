version: "3.7"

# Steam Headless V2: KDE Plasma (Wayland), Steam and Sunshine in one systemd
# container. Based on upstream's single-container host-network compose
# (steamheadless.com → Deploy with Docker Compose), with three umbrelOS
# changes, each explained where it is set:
#   - setup service: game folder ownership and two host kernel limits
#   - SYS_RESOURCE + ulimits: pipewire PAM limits (render GID clash)
#   - Sunshine drop-in: CAP_SYS_NICE for its encoder (written by setup)
#   - manifest port 30112: umbrelOS forwards it (after the Umbrel login) as
#     plain HTTP to 127.0.0.1:30112, but SHUI only speaks HTTPS on 8483, so
#     `open` answers there and sends the browser on to https://<host>:8483
# Plus the Orbit agent (kic2807/orbit-launcher), installed by `orbit-agent`.
#
# Host network: SHUI on TCP+UDP 8483 (HTTPS, own login), Sunshine on
# 47984-48010, Orbit agent on TCP 47800, Steam Remote Play on its usual
# ports. No app_proxy.
# LAN/Tailscale only: do not port-forward.

services:
  # One-shot, before the desktop on every start (exits, then the desktop
  # starts):
  #   - Downloads/steam owned by the umbrel user (1000); Docker creates a
  #     missing bind-mount folder as root
  #   - host kernel limits, raised only, reset on reboot:
  #     fs.inotify.max_user_instances >= 1024 (KDE/Steam, EMFILE otherwise)
  #     vm.max_map_count >= 1048576 (Proton games)
  #   - systemd drop-in giving Sunshine CAP_SYS_NICE (see the desktop's
  #     volumes); rewritten every start, so it follows this file
  # A limit that cannot be raised is logged as a warning and the desktop
  # still starts. Same image as the desktop, so nothing extra to pull.
  # Privileged, for the few seconds it runs: 2.44-4 tried CHOWN +
  # SYS_RESOURCE + systempaths=unconfined, and after a host reboot the
  # inotify limit could not be raised (256, "could not be raised").
  setup:
    image: josh5/steam-headless:2.44.20261019.1@sha256:c60f4d7243a4d94515f722441fff90b752413bf6a45bb221c9a4ed55bc4d9108
    restart: "no"
    user: "0:0"
    privileged: true
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        chown 1000:1000 /games
        raise() {
          cur=$$(cat "$$1")
          if [ "$$cur" -ge "$$2" ]; then
            echo "$$1: $$cur (ok)"
          elif (echo "$$2" > "$$1") 2>/dev/null; then
            echo "$$1: $$cur -> $$2"
          else
            echo "WARNING: $$1 is $$cur and could not be raised to $$2"
          fi
        }
        raise /proc/sys/fs/inotify/max_user_instances 1024
        raise /proc/sys/vm/max_map_count 1048576
        printf '%s\n' '# Written by things-steam-headless setup.' \
          '# Sunshine runs as steamheadless with no capabilities; this' \
          '# passes SYS_NICE from cap_add to it for encoder priority.' \
          '[Service]' 'AmbientCapabilities=CAP_SYS_NICE' > /dropins/50-things-sys-nice.conf
        echo "sunshine drop-in: AmbientCapabilities=CAP_SYS_NICE"
    volumes:
      - ${UMBREL_ROOT}/data/storage/downloads/steam:/games
      # Sunshine drop-in, mounted read-only by the desktop
      - ${APP_DATA_DIR}/data/sunshine.service.d:/dropins

  # Home screen icon: a page on 127.0.0.1:30112 that sends the browser to
  # SHUI on the host name it used (umbrel, umbrel.local, LAN or Tailscale
  # IP), port 8483. JavaScript, because umbrelOS's proxy may not pass the
  # original host name. Same Caddy image as things-caddy (already pulled).
  open:
    image: ghcr.io/kic2807/caddy-cloudflare:2.11.7-cf0.2.4@sha256:a13874bd33fdedf41b20feb5b25f61347d2807e2f3644ca624ae7491d270718d
    restart: on-failure
    network_mode: host
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      XDG_CONFIG_HOME: /tmp
      XDG_DATA_HOME: /tmp
    tmpfs:
      - /tmp
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/Caddyfile <<'CADDY'
        {
        	admin off
        	persist_config off
        	auto_https off
        }
        http://:30112 {
        	bind 127.0.0.1
        	header Content-Type "text/html; charset=utf-8"
        	header Cache-Control no-store
        	respond `<!doctype html><meta charset="utf-8"><title>Steam Headless</title><script>location.replace("https://"+location.hostname+":8483/")</script><p>Opening Steam Headless on port 8483 (HTTPS)...</p>` 200
        }
        CADDY
        exec caddy run --adapter caddyfile --config /tmp/Caddyfile

  # One-shot, before the desktop: the Orbit agent installer
  # (kic2807/orbit-launcher, agent/deploy). Copies the agent binary, its
  # systemd unit and an access token (made once, kept) into data/orbit, and
  # a Sunshine drop-in (Wants=orbit-agent.service) next to setup's, so the
  # agent starts with Sunshine. The agent runs in the desktop as
  # steamheadless on TCP 47800 (library, launch, game events, artwork) and
  # keeps one Sunshine application per installed Steam game (0.2.0+).
  # Public package (built from the private repository), no login needed.
  orbit-agent:
    image: ghcr.io/kic2807/orbit-agent:0.3.0@sha256:3a7a080be606ba3d670f62daf207fd6732ee2081ba21cdbac5ff79f63b7042d6
    restart: "no"
    user: "0:0"
    cap_drop:
      - ALL
    # CHOWN hands the token to steamheadless (1000); FOWNER lets root then
    # chmod it 0600 (install.sh chowns before it chmods; without FOWNER:
    # "chmod: /out/token: Operation not permitted", desktop never starts).
    cap_add:
      - CHOWN
      - FOWNER
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${APP_DATA_DIR}/data/orbit:/out
      - ${APP_DATA_DIR}/data/sunshine.service.d:/dropins

  desktop:
    image: josh5/steam-headless:2.44.20261019.1@sha256:c60f4d7243a4d94515f722441fff90b752413bf6a45bb221c9a4ed55bc4d9108
    restart: on-failure
    network_mode: host
    depends_on:
      setup:
        condition: service_completed_successfully
      orbit-agent:
        condition: service_completed_successfully

    # Upstream's capabilities and security options (systemd in an
    # unprivileged container, Flatpak/Proton sandboxes, virtual input).
    # writable-cgroups needs Docker 28+ (umbrelOS 2.0: 28.5, 2.1: 29).
    cap_add:
      - DAC_READ_SEARCH
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_NICE
      - SYS_PTRACE
      # Added for umbrelOS, see "pipewire limits" below.
      - SYS_RESOURCE
    security_opt:
      - apparmor:unconfined
      - seccomp=unconfined
      - systempaths=unconfined
      - writable-cgroups=true
    cgroup: private

    # pipewire limits: on umbrelOS the host render group (GID 991, owner of
    # renderD128) is the image's pipewire group, so the desktop user joins
    # pipewire for GPU access. The image's limits.d/25-pw-rlimits.conf then
    # sets rtprio 70 and nice -19 at every runuser/login, which pam_limits
    # can only do with SYS_RESOURCE ("runuser: cannot open session:
    # Permission denied" and a restart loop otherwise). The hard limits
    # below cover those values; tested together with SYS_RESOURCE.
    ulimits:
      rtprio: 70
      nice: 40
      memlock: -1

    # Graceful systemd shutdown
    stop_signal: SIGRTMIN+3
    stop_grace_period: 30s
    pids_limit: 8192
    shm_size: 2gb
    tty: true

    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Seoul

    # Only the render node, as upstream does (headless: no card*). With a
    # second GPU, check /dev/dri/by-path for the right renderD node.
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/fuse:/dev/fuse
      - /dev/uinput:/dev/uinput
      - /dev/uhid:/dev/uhid
    # Input event devices created by Sunshine and virtual controllers
    device_cgroup_rules:
      - "c 13:* rwm"

    tmpfs:
      - /run
      - /run/lock
      - /tmp
      - /dev/input:rw,dev,mode=0755

    volumes:
      - /etc/localtime:/run/host-localtime:ro
      - /sys/devices/virtual/input:/sys/devices/virtual/input:ro
      # SHUI credentials and TLS certificate (root-owned)
      - ${APP_DATA_DIR}/data/state:/var/lib/steam-headless
      # systemd journal (7 days)
      - ${APP_DATA_DIR}/data/journal:/var/log/journal
      # Desktop profile, Steam client, Proton prefixes, saves (UID 1000)
      - ${APP_DATA_DIR}/data/home:/home/steamheadless
      # Games: Downloads/steam; the container creates the Steam library in
      # /mnt/games/GameLibrary/Steam.
      - ${UMBREL_ROOT}/data/storage/downloads/steam:/mnt/games
      # Sunshine runs as steamheadless (User= in its unit), so it gets none
      # of the container's capabilities: "CAP_SYS_NICE capability is
      # missing", no high GPU priority for the encoder, stream stutter when
      # a game holds the GPU at 100%. This drop-in (written by setup) passes
      # SYS_NICE, already in cap_add, to Sunshine only.
      - ${APP_DATA_DIR}/data/sunshine.service.d:/etc/systemd/system/steam-headless-sunshine.service.d:ro
      # Orbit agent, written by orbit-agent before every start
      - ${APP_DATA_DIR}/data/orbit/orbit-agent:/usr/local/bin/orbit-agent:ro
      - ${APP_DATA_DIR}/data/orbit/orbit-agent.service:/etc/systemd/system/orbit-agent.service:ro
      - ${APP_DATA_DIR}/data/orbit/token:/etc/orbit-agent-token:ro
