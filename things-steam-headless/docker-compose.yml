version: "3.7"

# Steam Headless V2: KDE Plasma (Wayland), Steam and Sunshine in one systemd
# container. Based on upstream's single-container host-network compose
# (steamheadless.com → Deploy with Docker Compose), with three umbrelOS
# changes, each explained where it is set:
#   - setup service: game folder ownership and two host kernel limits
#   - SYS_RESOURCE + ulimits: pipewire PAM limits (render GID clash)
#   - manifest port 30112 is a placeholder (umbrel-app.yml, README)
#
# Host network: SHUI on TCP+UDP 8483 (HTTPS, own login), Sunshine on
# 47984-48010, Steam Remote Play on its usual ports. No app_proxy.
# LAN/Tailscale only: do not port-forward.

services:
  # One-shot, before the desktop on every start (exits, then the desktop
  # starts):
  #   - Downloads/steam owned by the umbrel user (1000); Docker creates a
  #     missing bind-mount folder as root
  #   - host kernel limits, raised only, reset on reboot:
  #     fs.inotify.max_user_instances >= 1024 (KDE/Steam, EMFILE otherwise)
  #     vm.max_map_count >= 1048576 (Proton games)
  # A limit that cannot be raised is logged as a warning and the desktop
  # still starts. Same image as the desktop, so nothing extra to pull.
  # Capabilities: CHOWN for the folder, SYS_RESOURCE for the inotify limit
  # (a per-user-namespace sysctl); systempaths=unconfined makes /proc/sys
  # writable. Nothing else, no privileged mode.
  setup:
    image: josh5/steam-headless:2.44.20261019.1@sha256:c60f4d7243a4d94515f722441fff90b752413bf6a45bb221c9a4ed55bc4d9108
    restart: "no"
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SYS_RESOURCE
    security_opt:
      - systempaths=unconfined
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        chown 1000:1000 /games
        raise() {
          cur=$$(cat "$$1")
          if [ "$$cur" -ge "$$2" ]; then
            echo "$$1: $$cur (ok)"
          elif (echo "$$2" > "$$1") 2>/dev/null; then
            echo "$$1: $$cur -> $$2"
          else
            echo "WARNING: $$1 is $$cur and could not be raised to $$2"
          fi
        }
        raise /proc/sys/fs/inotify/max_user_instances 1024
        raise /proc/sys/vm/max_map_count 1048576
    volumes:
      - ${UMBREL_ROOT}/data/storage/downloads/steam:/games

  desktop:
    image: josh5/steam-headless:2.44.20261019.1@sha256:c60f4d7243a4d94515f722441fff90b752413bf6a45bb221c9a4ed55bc4d9108
    restart: on-failure
    network_mode: host
    depends_on:
      setup:
        condition: service_completed_successfully

    # Upstream's capabilities and security options (systemd in an
    # unprivileged container, Flatpak/Proton sandboxes, virtual input).
    # writable-cgroups needs Docker 28+ (umbrelOS 2.0: 28.5, 2.1: 29).
    cap_add:
      - DAC_READ_SEARCH
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_NICE
      - SYS_PTRACE
      # Added for umbrelOS, see "pipewire limits" below.
      - SYS_RESOURCE
    security_opt:
      - apparmor:unconfined
      - seccomp=unconfined
      - systempaths=unconfined
      - writable-cgroups=true
    cgroup: private

    # pipewire limits: on umbrelOS the host render group (GID 991, owner of
    # renderD128) is the image's pipewire group, so the desktop user joins
    # pipewire for GPU access. The image's limits.d/25-pw-rlimits.conf then
    # sets rtprio 70 and nice -19 at every runuser/login, which pam_limits
    # can only do with SYS_RESOURCE ("runuser: cannot open session:
    # Permission denied" and a restart loop otherwise). The hard limits
    # below cover those values; tested together with SYS_RESOURCE.
    ulimits:
      rtprio: 70
      nice: 40
      memlock: -1

    # Graceful systemd shutdown
    stop_signal: SIGRTMIN+3
    stop_grace_period: 30s
    pids_limit: 8192
    shm_size: 2gb
    tty: true

    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Seoul

    # Only the render node, as upstream does (headless: no card*). With a
    # second GPU, check /dev/dri/by-path for the right renderD node.
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/fuse:/dev/fuse
      - /dev/uinput:/dev/uinput
      - /dev/uhid:/dev/uhid
    # Input event devices created by Sunshine and virtual controllers
    device_cgroup_rules:
      - "c 13:* rwm"

    tmpfs:
      - /run
      - /run/lock
      - /tmp
      - /dev/input:rw,dev,mode=0755

    volumes:
      - /etc/localtime:/run/host-localtime:ro
      - /sys/devices/virtual/input:/sys/devices/virtual/input:ro
      # SHUI credentials and TLS certificate (root-owned)
      - ${APP_DATA_DIR}/data/state:/var/lib/steam-headless
      # systemd journal (7 days)
      - ${APP_DATA_DIR}/data/journal:/var/log/journal
      # Desktop profile, Steam client, Proton prefixes, saves (UID 1000)
      - ${APP_DATA_DIR}/data/home:/home/steamheadless
      # Games: Downloads/steam; the container creates the Steam library in
      # /mnt/games/GameLibrary/Steam.
      - ${UMBREL_ROOT}/data/storage/downloads/steam:/mnt/games
