manifestVersion: 1
id: things-steam-headless
category: gaming
name: Steam Headless
version: "2.44-4"
tagline: Steam desktop for browser, Moonlight and Remote Play streaming
icon: https://raw.githubusercontent.com/kic2807/things-store/main/things-steam-headless/icon.svg
description: >-
  Steam Headless runs a full KDE Plasma desktop with Steam, Proton and Sunshine in a container, with no monitor attached. Play from a browser (WebRTC), from Moonlight on phones, TVs and handhelds, or with Steam Remote Play / Steam Link.


  Needs an Intel or AMD GPU with hardware video encoding (/dev/dri/renderD128) and at least 16 GB of RAM. Open https://<your-umbrel-ip>:8483 directly (HTTPS, self-signed certificate). The home screen icon does not work: its port (30112) is only a placeholder. Sign in as steamheadless; the first sign-in uses a temporary password from the app logs. Games are stored in Downloads/steam. LAN and Tailscale only. See the README in the store repository.
releaseNotes: >-
  The setup helper no longer runs in privileged mode: it only gets the two capabilities it needs, and a kernel limit it cannot raise is logged as a warning instead of stopping the app. README reorganised.

developer: Steam Headless
website: https://steamheadless.com
dependencies: []
repo: https://github.com/Steam-Headless/docker-steam-headless
support: https://github.com/Steam-Headless/docker-steam-headless/issues

port: 30112
gallery: []
path: ""

defaultUsername: ""
defaultPassword: ""

permissions:
  - STORAGE_DOWNLOADS

submitter: kic2807
submission: https://github.com/kic2807/things-store
