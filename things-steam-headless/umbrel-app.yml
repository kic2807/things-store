manifestVersion: 1
id: things-steam-headless
category: gaming
name: Steam Headless
version: "2.44-23"
tagline: Steam desktop for browser, Moonlight and Remote Play streaming
icon: https://raw.githubusercontent.com/kic2807/things-store/main/things-steam-headless/icon.svg
description: >-
  Steam Headless runs a full KDE Plasma desktop with Steam, Proton and Sunshine in a container, with no monitor attached. Play from a browser (WebRTC), from Moonlight on phones, TVs and handhelds, or with Steam Remote Play / Steam Link.


  Needs an Intel or AMD GPU with hardware video encoding (/dev/dri/renderD128) and at least 16 GB of RAM. The home screen icon opens a page that forwards to https://<your-umbrel>:8483 (HTTPS, self-signed certificate). Sign in as steamheadless; the first sign-in uses a temporary password from the app logs. Games are stored in Downloads/steam. Includes the Orbit agent (port 47800) for the Orbit launcher. LAN and Tailscale only. See the README in the store repository.
releaseNotes: >-
  XeSS on XMX for Proton games on Intel Arc GPUs with XMX units (xess-xmx-linux): super resolution and up to 4x frame generation run on the GPU's matrix units. Turns itself on for such GPUs; nothing changes on others.

developer: Steam Headless
website: https://steamheadless.com
dependencies: []
repo: https://github.com/Steam-Headless/docker-steam-headless
support: https://github.com/Steam-Headless/docker-steam-headless/issues

port: 30112
gallery: []
path: ""

defaultUsername: ""
defaultPassword: ""

permissions:
  - STORAGE_DOWNLOADS

submitter: kic2807
submission: https://github.com/kic2807/things-store
