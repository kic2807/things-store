version: "3.7"

# No web UI, so there is no app_proxy service. The manifest port is only a
# placeholder. The API is reached only through the Cloudflare Tunnel
# (cloudflared below); no host ports are published.

services:
  server:
    image: ghcr.io/kic2807/subsy-cost-server:1.0.0@sha256:5dd5ced7d4a8ca0875694be619c744c7acb53f34db94bedcdd9fae8c567e7741
    restart: unless-stopped
    user: "1000:1000"
    environment:
      TZ: Asia/Seoul
      DATA_DIR: /data
      # Optional overrides of the built-in workspaces.json / annotations.json
      CONFIG_DIR: /data/config
    # Superset account, APP_TOKEN, tunnel token etc. come from the app data
    # .env file; see .env.example.
    env_file:
      - path: ${APP_DATA_DIR}/data/.env
        required: false
    volumes:
      # SQLite database and daily backups (data/backups).
      - ${APP_DATA_DIR}/data:/data
    mem_limit: 256m
    cpus: 1.0

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    restart: unless-stopped
    # Reads TUNNEL_TOKEN from the same .env. The tunnel's public hostname must
    # point to http://things-subsy-cost_server_1:8080 (container name: every
    # Umbrel app shares one network, so the bare service name is ambiguous).
    command: tunnel --no-autoupdate run
    env_file:
      - path: ${APP_DATA_DIR}/data/.env
        required: false
    mem_limit: 64m
    depends_on:
      - server
