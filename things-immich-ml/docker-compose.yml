version: "3.7"

# Immich machine learning with Intel GPU acceleration (OpenVINO), for the
# official Umbrel Immich app. Umbrel's Immich ships the CPU-only image; this
# app runs the -openvino variant of the same version and Immich is pointed at
# it in Administration → Settings → Machine Learning (built-in container kept
# as fallback). The manifest's GPU permission makes umbrelOS map /dev/dri and
# the render group into the container, as it does for Immich.
#
# No web UI: no app_proxy, the manifest port is a placeholder.

services:
  server:
    # Keep the version equal to Umbrel's Immich (immich_server_1).
    image: ghcr.io/immich-app/immich-machine-learning:v3.3.6-openvino@sha256:035c30de002da9d4d4ae3872107bb9d8e195ead1c1f9fd470a2b0149ed37aec1
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/model-cache:/cache
