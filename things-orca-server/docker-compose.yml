version: "3.7"

# Orca's headless server (`orca serve`): repos, worktrees and coding agents
# (Claude Code, Codex, ...) run here; the Orca desktop app on a Mac (or Orca
# Mobile) connects to it as a remote server.
#
# The runtime speaks WebSocket on 6768, published directly (no app_proxy):
# umbrelOS would put its own HTTPS proxy on the manifest port, so that is a
# placeholder (30113). Access needs a pairing token (`orca pair`, see README).
# LAN/Tailscale only: do not port-forward 6768.
#
# Optional `tailscale` service: an HTTP/SOCKS5 proxy that leaves through a
# Tailscale exit node, for git hosts that only accept connections from one
# network (e.g. a work GitLab behind an office IP allowlist). Off until
# data/.env has TS_AUTHKEY; git uses it only for the hosts configured with
# `http.<url>.proxy` (README). The server's own traffic stays direct.

services:
  # Creates Documents/projects owned by the umbrel user (Docker would
  # create a missing folder as root, which the server could not write to).
  setup:
    image: ghcr.io/kic2807/orca-server:1.4.265-r2@sha256:0b01093aafece46620cd4e605a9f9ce32d1a92fdd1c8336c38b6358c8fb298c7
    restart: "no"
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    entrypoint: ["chown", "1000:1000", "/projects"]
    volumes:
      - ${UMBREL_ROOT}/home/Documents/projects:/projects

  server:
    # Built in this repo from the official release bundle
    # (.github/workflows/build-orca-server.yml).
    image: ghcr.io/kic2807/orca-server:1.4.265-r2@sha256:0b01093aafece46620cd4e605a9f9ce32d1a92fdd1c8336c38b6358c8fb298c7
    restart: on-failure
    init: true
    # The agents run as the umbrel user (1000) with no capabilities: no sudo,
    # no apt. Tools go into ~/.local (npm prefix, Claude Code's installer).
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    depends_on:
      setup:
        condition: service_completed_successfully
    # Pairing must stay on: --no-pairing also makes `orca pair` refuse
    # ("disabled_by_operator"). The startup log then shows a pairing link for
    # 127.0.0.1, which no client can use; make one with
    # `orca pair --address <umbrel-ip>` (README).
    command: ["orca", "serve", "--port", "6768", "--bind", "0.0.0.0", "--supervise"]
    ports:
      - "6768:6768"
    environment:
      TZ: Asia/Seoul
    volumes:
      # Everything persistent: Orca's profile (~/.config/orca), agent logins
      # (~/.claude, ~/.codex), git/gh/ssh config, ~/.local tools and the
      # repos you clone (e.g. ~/projects).
      - ${APP_DATA_DIR}/data/home:/home/orca
      # Shared projects: Documents/projects in the Umbrel Files app (and
      # over SMB), ~/projects on the server. Kept when the app is uninstalled.
      - ${UMBREL_ROOT}/home/Documents/projects:/home/orca/projects
      # Orca seals stored credentials with a key mixed with the machine ID;
      # the host's keeps them readable across image updates.
      - /etc/machine-id:/etc/machine-id:ro

  tailscale:
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    restart: on-failure
    # Userspace networking: no tun device, no capabilities. The proxies dial
    # out through the tailnet, so the exit node applies to them only.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TS_HOSTNAME: things-orca-server
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_ACCEPT_DNS: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
      # Reached from the server container as
      # things-orca-server_tailscale_1:1055 (HTTP) or :1080 (SOCKS5); not
      # published on the host.
      TS_OUTBOUND_HTTP_PROXY_LISTEN: ":1055"
      TS_SOCKS5_SERVER: ":1080"
      # containerboot runs `tailscale up` on every start; --reset clears the
      # exit node persisted by `tailscale set`, which the loop sets again.
      TS_EXTRA_ARGS: --reset
    # TS_AUTHKEY and EXIT_NODE come from the app data .env file.
    env_file:
      - path: ${APP_DATA_DIR}/data/.env
        required: false
    volumes:
      - ${APP_DATA_DIR}/data/tailscale:/var/lib/tailscale
    # Without TS_AUTHKEY the service only waits (the app works as before).
    # Otherwise containerboot, then the exit node (EXIT_NODE: a Tailscale
    # device name or IP), set once the node is up and again whenever
    # `tailscale status` shows none.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$TS_AUTHKEY" ]; then
          echo "proxy off: no TS_AUTHKEY in data/.env"
          trap 'exit 0' TERM INT
          while true; do sleep 3600 & wait $$!; done
        fi
        /usr/local/bin/containerboot &
        boot=$$!
        trap 'kill -TERM $$boot 2>/dev/null; wait $$boot' TERM INT
        if [ -n "$$EXIT_NODE" ]; then
          (
            ts() { tailscale --socket=/tmp/tailscaled.sock "$$@"; }
            until wget -q -O /dev/null http://127.0.0.1:9002/healthz; do sleep 2; done
            while true; do
              if ! ts status --json 2>/dev/null | grep -q '"ExitNodeStatus"'; then
                ts set --exit-node="$$EXIT_NODE" && echo "exit node set: $$EXIT_NODE"
              fi
              sleep 30
            done
          ) &
        else
          echo "EXIT_NODE is not set in data/.env: the proxy leaves directly"
        fi
        wait $$boot
