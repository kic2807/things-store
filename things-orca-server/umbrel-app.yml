manifestVersion: 1
id: things-orca-server
folderAccess:
  - id: projects
    name: Projects
    note: Your project folders, ~/projects on the server. Copy projects here with the Files app, SMB or rsync.
    mounts:
      - service: server
        targetPath: /home/orca/projects
      - service: setup
        targetPath: /projects
category: developer
name: Orca Server
version: "1.4.265-1"
tagline: Run Orca's coding agents and worktrees on this server
icon: https://raw.githubusercontent.com/kic2807/things-store/main/things-orca-server/icon.svg
description: >-
  Orca's headless server (orca serve). Repositories, worktrees, terminals and coding agents such as Claude Code and Codex run on the Umbrel, so they keep working when your laptop sleeps. The Orca desktop app connects to it under Settings → Remote Orca Servers, and Orca Mobile can connect too.


  No web UI: the home screen icon does nothing (its port, 30113, is only a placeholder). The server listens on port 6768. Pair a client by running `orca pair` in the container, install and sign in to the agent CLIs once, and clone your repositories. LAN and Tailscale only. See the README in the store repository.
releaseNotes: >-
  Optional proxy through a Tailscale exit node for git hosts that only accept one network, such as a work GitLab behind an office IP allowlist. Off unless you add a Tailscale auth key; see the README.

developer: Stably AI
website: https://orca.dev
dependencies: []
repo: https://github.com/stablyai/orca
support: https://github.com/stablyai/orca/issues

port: 30113
gallery: []
path: ""

defaultUsername: ""
defaultPassword: ""

submitter: kic2807
submission: https://github.com/kic2807/things-store
