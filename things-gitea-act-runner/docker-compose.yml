version: "3.7"

# No web UI, so there is no app_proxy service. Check the runner's status in
# Gitea (Site/Org/Repo settings -> Actions -> Runners) instead.

services:
  dind:
    image: docker:29.9.2-dind@sha256:ba3d67c44952ffc448696659a36ef91dd813f03a9c70a2bc0ad1d286d542f4fb
    # Docker-in-Docker needs privileged mode to run job containers. This is an
    # isolated daemon; the host Docker socket is never mounted.
    privileged: true
    restart: on-failure
    environment:
      DOCKER_TLS_CERTDIR: ""
    # Listen on loopback only. The runner shares this network namespace, so it
    # reaches the daemon at localhost; other containers on the Umbrel network
    # cannot. No ports are published to the host.
    command:
      - dockerd
      - --host=unix:///var/run/docker.sock
      - --host=tcp://127.0.0.1:2375
      - --tls=false
    volumes:
      # Image/layer cache for jobs, kept across restarts (excluded from backups).
      - ${APP_DATA_DIR}/data/dind:/var/lib/docker

  runner:
    image: gitea/runner:5.2.3@sha256:29aebfb521b00b9c10b6f13ca70b776d1f8f77be8f24d8ce78ed75c5252320bf
    network_mode: service:dind
    restart: on-failure
    depends_on:
      - dind
    environment:
      DOCKER_HOST: tcp://localhost:2375
      GITEA_RUNNER_NAME: umbrel_dind_runner
    # GITEA_INSTANCE_URL and GITEA_RUNNER_REGISTRATION_TOKEN come from the app
    # data .env file. The token is only used for the first registration.
    env_file:
      - path: ${APP_DATA_DIR}/data/.env
        required: false
    volumes:
      # Registration state (.runner) lives in /data, so restarts and updates do
      # not re-register.
      - ${APP_DATA_DIR}/data/runner:/data
