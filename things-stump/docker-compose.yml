version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: things-stump_server_1
      APP_PORT: 10801
      # Stump has its own login. Reader apps (OPDS, Kobo, KOReader, the Stump
      # mobile app) cannot send Umbrel's login cookie, so their endpoints skip
      # Umbrel login. The web UI itself stays behind it.
      PROXY_AUTH_WHITELIST: "/api/*,/opds/*,/kobo/*,/koreader/*"

  server:
    image: aaronleopold/stump:nightly@sha256:400e98ed622ef6ca9fb8346770d5f090efd6be4bf596647cc6b05091b328653d
    restart: on-failure
    environment:
      # The entrypoint creates this user and chowns /config.
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Seoul
      STUMP_CONFIG_DIR: /config
      # Uploads are off by default, and they include setting a series or
      # book cover from an image file (the upload is rejected otherwise).
      STUMP_ENABLE_UPLOAD: "true"
      # Requests come through Caddy (HTTPS) or Umbrel's app_proxy; without
      # this Stump ignores X-Forwarded-Proto, builds http:// links (OPDS,
      # Kobo, EPUB) and logs a warning on every request.
      STUMP_TRUST_PROXY_HEADERS: "true"
    # Optional extra STUMP_* settings come from the app data .env file.
    env_file:
      - path: ${APP_DATA_DIR}/data/.env
        required: false
    volumes:
      # Database, thumbnails, logs
      - ${APP_DATA_DIR}/data/config:/config
      # Library. Defaults to Downloads/comics; change it in the app's settings
      # (Folder access -> Books).
      - ${UMBREL_ROOT}/data/storage/downloads/comics:/data
